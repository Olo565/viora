name: Build Release (Android & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (AAB & APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Configure Android Keystore & key.properties
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
          elif [ -f "android/app/upload-keystore.jks" ]; then
            echo "storePassword=viorasecure2026" > android/key.properties
            echo "keyPassword=viorasecure2026" >> android/key.properties
            echo "keyAlias=upload" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
          fi

      - name: Build Android App Bundle (.aab for Play Store)
        run: flutter build appbundle --release

      - name: Build Standalone APK (.apk for Direct Device Testing)
        run: flutter build apk --release

      - name: Upload Android App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: viora-playstore-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload Standalone Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: viora-testing-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  build-ios:
    name: Build iOS (Xcode Archive)
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Framework & Assets
        run: flutter build ios --release --no-codesign

      - name: Compress iOS Build Output
        run: |
          cd build/ios/iphoneos
          zip -r ../../../viora-ios-runner.zip Runner.app

      - name: Upload iOS Runner Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viora-ios-build
          path: viora-ios-runner.zip
          retention-days: 14
